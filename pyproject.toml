[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PoliSense"
version = "1.0.0"
description = "RAG pipeline core: ingestion + retrieval"
requires-python = ">=3.10"
dependencies = [
    "langchain-community",
    "langchain-huggingface",
    "langchain",
    "langchain-chroma",
    "langchain-openai",
    "langchain-google-genai",
    "sentence-transformers",
    "faiss-cpu",
    "chromadb",
    "pypdf",
    "python-dotenv",
    "nltk",
    "rake-nltk",
    "pyyaml",
    "lark",
    "psycopg2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["polisense_core*"]