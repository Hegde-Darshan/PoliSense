services:
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: ${CHROMA_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${CHROMA_PORT}:8000"
    volumes:
      - ./chroma_data:/chroma/chroma  # persists DB to local folder
    entrypoint: ["chroma"]
    command: ["run", "--host", "0.0.0.0", "--port", "8000", "--path", "/chroma/chroma"]
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
      - LOG_LEVEL=INFO